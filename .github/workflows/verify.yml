name: Verify and stage component

on:
  pull_request:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22 (Node 24)
      - name: Test candidate and release safety gates without credentials
        run: |
          bash scripts/test-artifact-approval.sh
          bash scripts/test-release-oci-preflight.sh
          bash scripts/test-release-absent.sh
      - name: Independently build and test
        run: nix develop --command make test
      - name: Validate exact component and checksum
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command wasm-tools validate dist/plugin.fs.wasm
          python3 scripts/wasm-notices.py verify dist/plugin.fs.wasm --license LICENSE --notice NOTICE
          test -s dist/plugin.fs.wasm
          (cd dist && sha256sum plugin.fs.wasm > SHA256SUMS && sha256sum --check SHA256SUMS)
      # Public GitHub Actions artifacts are distribution. Never upload a WASM
      # from this unlicensed snapshot; approving both exact texts is required.
      - name: Approve candidate bytes and stage licensing files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release' && vars.GAMS_FS_ARTIFACT_UPLOAD_APPROVED == 'true'
        shell: bash
        env:
          APPROVED: ${{ vars.GAMS_FS_ARTIFACT_UPLOAD_APPROVED }}
          APPROVED_LICENSE_SHA256: ${{ vars.GAMS_FS_LICENSE_SHA256 }}
          APPROVED_NOTICE_SHA256: ${{ vars.GAMS_FS_NOTICE_SHA256 }}
        run: bash scripts/check-artifact-approval.sh
      - name: Upload reviewed CI candidate (not a release)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release' && vars.GAMS_FS_ARTIFACT_UPLOAD_APPROVED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: plugin-fs-ci-${{ github.sha }}
          path: |
            dist/plugin.fs.wasm
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
